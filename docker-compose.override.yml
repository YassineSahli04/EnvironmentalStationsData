services:
  frontend:
    depends_on:
      - api
    restart: unless-stopped
    image: node:24-slim
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./FrontEnd:/app
      - vite_node_modules:/app/node_modules
    command: sh -lc "npm ci && npm run dev -- --host 0.0.0.0"

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: AGRODATA
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  dump_fetch:
    image: alpine:3.20
    volumes:
      - ./Secrets/deploy_key:/keys/deploy_key:ro
      - dumps:/dumps
      - ./Scripts:/scripts:ro
    environment:
      DEPLOY_USER: Administrator
      DEPLOY_HOST: 100.89.242.54
      REMOTE_DUMP_PATH: "C:/Users/Administrator/Desktop/AGRODATA/DbDumpFiles/latest.dump"
    entrypoint: ["/bin/sh", "/scripts/fetch_db_dump.sh"]

  db_restore:
    image: postgres:18
    depends_on:
      dump_fetch:
        condition: service_completed_successfully
      db:
        condition: service_started
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: AGRODATA
      DB_USER: postgres
      DB_PASSWORD: postgres
    volumes:
      - dumps:/dumps:ro
      - ./Scripts:/scripts:ro
    entrypoint: ["/bin/bash", "/scripts/restore_db.sh"]
  api:
    build:
      context: ./BackEnd
      dockerfile: Dockerfile.dev
    command: uvicorn BackEnd.app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - 8000:8000
    volumes:
      - ./BackEnd:/app/BackEnd
      - ./Secrets/DbInfo.json:/run/secrets/DbInfo.json:ro
      - ./Secrets/C2aiInfo.json:/run/secrets/C2aiInfo.json:ro
      - ./Secrets/clerk_secret_key:/run/secrets/clerk_secret_key:ro
    environment:
      - CLERK_KEY_PATH=/run/secrets/clerk_secret_key
      - DBINFO_PATH=/run/secrets/DbInfo.json
      - C2AIINFO_PATH=/run/secrets/C2aiInfo.json
      - REDIS_URL=redis://redis:6379/0

  backend-dev:
    build:
      context: ./BackEnd
      dockerfile: Dockerfile.dev
    command: jupyter lab --ip=0.0.0.0 --port 8888 --no-browser --allow-root
    ports:
      - 8888:8888
      - 5678:5678
    volumes:
      - ./PlaygroundFile.ipynb:/app/PlaygroundFile.ipynb
      - ./BackEnd:/app/BackEnd
      - ./Secrets/openAi_key:/run/secrets/openAi_key:ro
      - ./Secrets/DbInfo.json:/run/secrets/DbInfo.json:ro
      - ./Secrets/C2aiInfo.json:/run/secrets/C2aiInfo.json:ro
      - ./Secrets/clerk_secret_key:/run/secrets/clerk_secret_key:ro
    environment:
      - OPENAI_KEY_PATH=/run/secrets/openAi_key
      - CLERK_KEY_PATH=/run/secrets/clerk_secret_key
      - DBINFO_PATH=/run/secrets/DbInfo.json
      - C2AIINFO_PATH=/run/secrets/C2aiInfo.json
      - REDIS_URL=redis://redis:6379/0

volumes:
  vite_node_modules:
  pgdata:
  dumps:
