services:
  backend:
    image: ghcr.io/yassinesahli04/environmentalstationsdata-backend:${BACKEND_TAG:-latest}
    pull_policy: always
    build: !reset null
    volumes: !override
      - ./Secrets/DbInfo.json:/run/secrets/DbInfo.json:ro
      - ./Secrets/C2aiInfo.json:/run/secrets/C2aiInfo.json:ro

  worker:
    image: ghcr.io/yassinesahli04/environmentalstationsdata-worker:${WORKER_TAG:-latest}
    pull_policy: always
    build: !reset null
    volumes: !override
      - ./Secrets/DbInfo.json:/run/secrets/DbInfo.json:ro

  scheduler:
    image: ghcr.io/yassinesahli04/environmentalstationsdata-scheduler:${SCHEDULER_TAG:-latest}
    pull_policy: always
    build: !reset null

  frontend:
    profiles: ["dev"]
