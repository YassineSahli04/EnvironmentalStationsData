services:
  frontend:
    depends_on:
      - backend
    restart: unless-stopped
    image: node:24-slim
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./FrontEnd:/app
      - vite_node_modules:/app/node_modules
    command: sh -lc "npm ci && npm run dev -- --host 0.0.0.0"

  backend:
    build:
      context: ./BackEnd
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./BackEnd:/app/BackEnd
      - ./BackEnd/Secrets/DbInfo.json:/run/secrets/DbInfo.json:ro
      - ./BackEnd/Secrets/C2aiInfo.json:/run/secrets/C2aiInfo.json:ro
    environment:
      - DBINFO_PATH=/run/secrets/DbInfo.json
      - C2AIINFO_PATH=/run/secrets/C2aiInfo.json

volumes:
  vite_node_modules:
