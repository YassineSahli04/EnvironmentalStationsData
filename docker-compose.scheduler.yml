services:
  scheduler:
    image: python:3.12-slim
    depends_on:
      - backend
    container_name: AGRODATA-scheduler
    restart: unless-stopped
    working_dir: /scheduler
    volumes:
      - ./Scheduler:/scheduler
    environment:
      - UPDATE_URL=http://backend:8000/api/stations/server/update-db
      - PYTHONUNBUFFERED=1 
    command: sh -lc "python -m pip install --upgrade pip && pip install --no-cache-dir -r requirements.txt && python Scheduler.py"
