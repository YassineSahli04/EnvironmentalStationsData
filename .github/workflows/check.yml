name: Backend Checks

on:
  pull_request:
    branches: ["main"]

  push:
    branches: ["main"]

  workflow_dispatch:

jobs:
  unit-test-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: |
          python -m pytest BackEnd/tests/unit/ -v

  integration-test-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: |
          python -m pytest BackEnd/tests/integration/ -v
