name: Database Sync

on:
  push:
    branches: ["main", "dev"]

  workflow_dispatch:

  schedule:
    - cron: "0 7 * * *"

jobs:
  Db-Snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Connect runner to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
          | sudo tee /etc/apt/sources.list.d/postgresql.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18

      - name: Dump remote DB
        env:
          PGPASSWORD: ${{ secrets.SERVER_DB_PASSWORD }}
        run: |
          pg_dump \
            -h ${{ secrets.SERVER_DB_IP }} \
            -p ${{ secrets.SERVER_DB_PORT }} \
            -U postgres \
            -Fc AGRODATA \
            -f remote.dump

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Copy dump to server
        run: |
          scp -o StrictHostKeyChecking=no remote.dump \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:"C:/Users/Administrator/Desktop/AGRODATA/DbDumpFiles/latest.dump"
