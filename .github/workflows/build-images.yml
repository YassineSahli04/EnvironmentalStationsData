name: Build & Push Images

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      debug:
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Connect runner to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
      - name: Debug remote context
        if: ${{ inputs.debug == true }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          request_pty: true
          script: powershell -NoProfile -ExecutionPolicy Bypass -Command "$ErrorActionPreference = 'Stop'; whoami; hostname; docker version; docker compose version; Set-Location 'C:\Users\Administrator\Desktop\AGRODATA\Deploy'; dir; $null = New-Item -ItemType Directory -Force -Path 'C:\Users\Administrator\Desktop\AGRODATA\Deploy\logs'; Set-Content -Path 'C:\Users\Administrator\Desktop\AGRODATA\Deploy\logs\proof.txt' -Value 'proof' -Encoding utf8; dir 'C:\Users\Administrator\Desktop\AGRODATA\Deploy\logs'"
      - name: Deploy to Windows Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: powershell -NoProfile -ExecutionPolicy Bypass -Command "cd 'C:\Users\Administrator\Desktop\AGRODATA\Deploy'; docker compose -f docker-compose.yml -f docker-compose.worker.yml -f docker-compose.scheduler.yml -f docker-compose.prod.yml pull; docker compose -f docker-compose.yml -f docker-compose.worker.yml -f docker-compose.scheduler.yml -f docker-compose.prod.yml up -d --remove-orphans; $null = New-Item -ItemType Directory -Force -Path 'C:\Users\Administrator\Desktop\AGRODATA\Deploy\logs'; $ts = Get-Date -Format 'yyyyMMdd-HHmmss'; $logPath = 'C:\Users\Administrator\Desktop\AGRODATA\Deploy\logs\deploy-' + $ts + '.log'; $logs = docker compose -f docker-compose.yml -f docker-compose.worker.yml -f docker-compose.scheduler.yml -f docker-compose.prod.yml logs --no-color --tail 500; Set-Content -Path $logPath -Value $logs -Encoding utf8; docker compose -f docker-compose.yml -f docker-compose.worker.yml -f docker-compose.scheduler.yml -f docker-compose.prod.yml ps"
