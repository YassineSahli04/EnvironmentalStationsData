name: Build & Push Images

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      debug:
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Connect runner to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
      - name: Deploy to Windows Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: powershell -NoProfile -ExecutionPolicy Bypass -Command "$ErrorActionPreference='Stop'; $env:DOCKER_CONFIG='C:\Users\Administrator\Desktop\AGRODATA\Deploy\.docker-ci'; New-Item -ItemType Directory -Force -Path $env:DOCKER_CONFIG | Out-Null; echo '${{ secrets.GHCR_PAT }}' | docker login ghcr.io -u '${{ secrets.GHCR_USER }}' --password-stdin; cd 'C:\Users\Administrator\Desktop\AGRODATA\Deploy'; docker compose -f docker-compose.yml -f docker-compose.worker.yml -f docker-compose.scheduler.yml -f docker-compose.prod.yml pull; docker compose -f docker-compose.yml -f docker-compose.worker.yml -f docker-compose.scheduler.yml -f docker-compose.prod.yml up -d --remove-orphans; docker compose -f docker-compose.yml -f docker-compose.worker.yml -f docker-compose.scheduler.yml -f docker-compose.prod.yml ps"
